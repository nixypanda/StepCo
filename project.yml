name: StepCo
options:
  bundleIdPrefix: com.nixypanda
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: CR2269QVDK
    CODE_SIGN_STYLE: Automatic
targets:
  StepCo:
    type: application
    platform: iOS
    sources:
      - StepCo/App
      - StepCo/Shared
    resources:
      - StepCo/App/Assets.xcassets
    info:
      path: StepCo/App/Info.plist
      properties:
        CFBundleDisplayName: StepCo
        NSHealthShareUsageDescription: StepCo reads step count and walking distance to show your daily steps.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: StepCo/App/StepCo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.nixypanda.StepCo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixypanda.StepCo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEFINES_MODULE: YES
    dependencies:
      - target: StepCoWidget
      - target: StepCoWatch
  StepCoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StepCoTests
    dependencies:
      - target: StepCo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixypanda.StepCo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/StepCo.app/StepCo"
        BUNDLE_LOADER: "$(TEST_HOST)"
  StepCoWidget:
    type: app-extension
    platform: iOS
    sources:
      - StepCoWidget
      - StepCo/Shared/StepModels.swift
      - StepCo/Shared/StepColorStyle.swift
      - StepCo/Shared/StepSnapshotCache.swift
      - StepCo/Shared/StepDemoData.swift
    info:
      path: StepCoWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StepCoWidget/StepCoWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nixypanda.StepCo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixypanda.StepCo.widget
        SKIP_INSTALL: YES
  StepCoWatch:
    type: application
    platform: watchOS
    sources:
      - StepCo/WatchApp
      - StepCo/Shared
    info:
      path: StepCo/WatchApp/Info.plist
      properties:
        CFBundleDisplayName: StepCo
        NSHealthShareUsageDescription: StepCo reads step count and walking distance to show your daily steps.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.nixypanda.StepCo
    entitlements:
      path: StepCo/WatchApp/StepCoWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.nixypanda.StepCo
    dependencies:
      - target: StepCoWatchWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixypanda.StepCo.watchkitapp
  StepCoWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - StepCoWatchWidget
      - StepCo/Shared/StepModels.swift
      - StepCo/Shared/StepColorStyle.swift
      - StepCo/Shared/StepSnapshotCache.swift
      - StepCo/Shared/StepDemoData.swift
    info:
      path: StepCoWatchWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: StepCoWatchWidget/StepCoWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nixypanda.StepCo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nixypanda.StepCo.watchkitapp.widget
        SKIP_INSTALL: YES
schemes:
  StepCo:
    build:
      targets:
        StepCo: all
        StepCoWidget: all
        StepCoWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StepCoTests
  StepCoWatch:
    build:
      targets:
        StepCoWatch: all
        StepCoWatchWidget: all
    run:
      config: Debug
